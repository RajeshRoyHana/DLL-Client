  <!-- MAIN -->
  <div class="container mb-5">
    <div class="row">

      <!-- SIDEBAR -->
      <div class="col-md-3">
        <div class="sidebar">
          <h5>Categories</h5>

          @for (cat of categories; track cat.id) {
            <button
              [class.active-cat]="activeCategory === cat.id"
              (click)="selectCategory(cat.id)">
              {{ cat.label }} <span class="float-end">{{ cat.items.length }}</span>
            </button>
          }

          <hr>
          <button class="text-dark" routerLink="/contact">Still have questions →</button>
        </div>
      </div>

      <!-- FAQ CONTENT -->
      <div class="col-md-9">

        @if (activeSection) {
          <h4 class="mb-4">
            {{ (activeCategoryIndex + 1).toString().padStart(2, '0') }} {{ activeSection.label }}
          </h4>

          <div class="accordion">
            @for (item of activeSection.items; track item.question) {
              <div class="accordion-item">
                <button
                  class="accordion-button"
                  [class.collapsed]="!item.open"
                  (click)="toggleItem(item)">
                  {{ item.question }}
                </button>
                @if (item.open) {
                  <div class="accordion-body-wrapper">
                    <div class="accordion-body">
                      {{ item.answer }}
                    </div>
                  </div>
                }
              </div>
            }
          </div>
        }

      </div>

    </div>
  </div>
